<script>
"use strict";

/*
 * ONLINE SPHERE
 * M-Pesa backend integration
 *
 * Backend: https://online-sphere-backend.onrender.com
 *
 * IMPORTANT:
 * An accepted STK Push is not proof of payment.
 * Activate membership only after backend verification.
 * Registration/login below is demo-only.
 */

const MPESA_API = "https://online-sphere-backend.onrender.com";

const PACKAGE_PRICES = Object.freeze({
  Bronze: 1000,
  Silver: 1750,
  Gold: 2500
});

let selectedPackageName = "";
let selectedPackageAmount = 0;
let currentCheckoutRequestID = null;
let paymentRequestInProgress = false;
let toastTimer = null;

/* YEAR */

document.getElementById("year").textContent =
  new Date().getFullYear();

/* MOBILE MENU */

function toggleMenu() {
  const menu = document.getElementById("mobileMenu");
  const button = document.querySelector(".menu-button");

  menu.classList.toggle("show");

  button.setAttribute(
    "aria-expanded",
    menu.classList.contains("show") ? "true" : "false"
  );
}

/* AUTH MODAL */

function openModal(type) {
  document.getElementById("authModal").classList.add("show");
  switchForm(type);
}

function closeModal() {
  document.getElementById("authModal").classList.remove("show");
}

function switchForm(type) {
  const isLogin = type === "login";

  document.getElementById("loginForm").style.display =
    isLogin ? "block" : "none";

  document.getElementById("registerForm").style.display =
    isLogin ? "none" : "block";
}

/* DEMO PROFILE
   Replace this with server-side authentication before production.
*/

function readDemoUser() {
  try {
    return JSON.parse(
      localStorage.getItem("onlineSphereUser") || "null"
    );
  } catch (error) {
    return null;
  }
}

/* REGISTER DEMO PROFILE */

function registerUser() {
  const name =
    document.getElementById("registerName").value.trim();

  const email =
    document.getElementById("registerEmail")
      .value.trim().toLowerCase();

  const phone =
    document.getElementById("registerPhone").value.trim();

  const password =
    document.getElementById("registerPassword").value;

  const packageName =
    document.getElementById("registerPackage").value;

  if (!name || !email || !phone || !password) {
    showToast("Please complete all required fields.");
    return;
  }

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showToast("Enter a valid email address.");
    return;
  }

  if (password.length < 6) {
    showToast("Password must contain at least 6 characters.");
    return;
  }

  /*
   * DEMO ONLY:
   * Never store real user passwords in localStorage.
   * Production authentication must be handled by a secure backend.
   */

  const user = {
    name: name,
    email: email,
    phone: phone,
    package: "None",
    membershipStatus: "INACTIVE",
    createdAt: new Date().toISOString(),
    demoPassword: password
  };

  try {
    localStorage.setItem(
      "onlineSphereUser",
      JSON.stringify(user)
    );
  } catch (error) {
    showToast("Unable to save the demo profile in this browser.");
    return;
  }

  closeModal();

  showToast(
    "Demo profile created. Secure server registration is required for production."
  );

  if (
    Object.prototype.hasOwnProperty.call(
      PACKAGE_PRICES,
      packageName
    )
  ) {
    window.setTimeout(function () {
      choosePackage(
        packageName,
        PACKAGE_PRICES[packageName]
      );
    }, 350);
  }
}

/* LOGIN DEMO PROFILE */

function loginUser() {
  const email =
    document.getElementById("loginEmail")
      .value.trim().toLowerCase();

  const password =
    document.getElementById("loginPassword").value;

  const user = readDemoUser();

  if (!user) {
    showToast(
      "No demo profile found in this browser. Create an account first."
    );
    return;
  }

  if (
    email !== String(user.email || "").toLowerCase() ||
    password !== user.demoPassword
  ) {
    showToast(
      "Incorrect email or password for this browser's demo profile."
    );
    return;
  }

  closeModal();

  showToast(
    "Welcome back, " +
    (user.name || "member") +
    ". This is a local demo login."
  );
}

/* MEMBERSHIP PACKAGE SELECTION */

function choosePackage(name, amount) {
  if (
    !Object.prototype.hasOwnProperty.call(
      PACKAGE_PRICES,
      name
    )
  ) {
    showToast("Please select a valid membership package.");
    return;
  }

  const user = readDemoUser();

  if (!user) {
    openModal("register");

    document.getElementById("registerPackage").value = name;

    showToast(
      "Create your profile first, then continue to payment."
    );

    return;
  }

  selectedPackageName = name;
  selectedPackageAmount = PACKAGE_PRICES[name];
  currentCheckoutRequestID = null;

  document.getElementById("paymentPackage").textContent =
    selectedPackageName;

  document.getElementById("paymentAmount").textContent =
    "KSh " +
    selectedPackageAmount.toLocaleString("en-KE");

  document.getElementById("mpesaPhone").value =
    user.phone || "";

  resetPaymentStatus();

  document.getElementById("paymentModal")
    .classList.add("show");
}

/* CLOSE PAYMENT MODAL */

function closePaymentModal() {
  document.getElementById("paymentModal")
    .classList.remove("show");
}

/* NORMALIZE KENYAN PHONE NUMBER */

function normalizeKenyanPhone(value) {
  const phone = String(value || "").replace(/\D/g, "");

  if (phone.startsWith("07") && phone.length === 10) {
    return "254" + phone.slice(1);
  }

  if (phone.startsWith("01") && phone.length === 10) {
    return "254" + phone.slice(1);
  }

  if (phone.startsWith("254") && phone.length === 12) {
    return phone;
  }

  if (phone.length === 9 && /^[17]/.test(phone)) {
    return "254" + phone;
  }

  throw new Error(
    "Enter a valid Kenyan M-Pesa number, e.g. 0712345678."
  );
}

/* PAYMENT STATUS MESSAGE */

function setPaymentStatus(message, type) {
  const status = document.getElementById("paymentStatus");

  status.textContent = "";
  status.className = "payment-status show " + type;

  if (type === "waiting" && message === "loading") {
    const spinner = document.createElement("span");

    spinner.className = "payment-spinner";
    spinner.setAttribute("aria-hidden", "true");

    status.appendChild(spinner);

    status.appendChild(
      document.createTextNode(
        "Connecting to the M-Pesa service. Please wait…"
      )
    );
  } else {
    status.textContent = message;
  }
}

/* RESET PAYMENT FORM */

function resetPaymentStatus() {
  const status = document.getElementById("paymentStatus");

  status.textContent = "";
  status.className = "payment-status";

  const button = document.getElementById("mpesaButton");

  button.disabled = false;
  button.textContent = "📱 Send M-Pesa STK Push";
}

/* START M-PESA STK PUSH */

async function startMpesaPayment() {
  if (paymentRequestInProgress) {
    return;
  }

  if (
    !Object.prototype.hasOwnProperty.call(
      PACKAGE_PRICES,
      selectedPackageName
    )
  ) {
    setPaymentStatus(
      "Please select a valid membership package first.",
      "error"
    );
    return;
  }

  let phone;

  try {
    phone = normalizeKenyanPhone(
      document.getElementById("mpesaPhone").value
    );
  } catch (error) {
    setPaymentStatus(error.message, "error");
    return;
  }

  const user = readDemoUser();

  if (!user) {
    closePaymentModal();
    openModal("register");

    showToast("Please create your profile first.");

    return;
  }

  const button = document.getElementById("mpesaButton");

  paymentRequestInProgress = true;

  button.disabled = true;
  button.textContent = "Connecting to M-Pesa…";

  setPaymentStatus("loading", "waiting");

  try {
    const response = await fetch(
      `${MPESA_API}/api/mpesa/stkpush`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },

        /*
         * These are the expected backend fields.
         * Do not send "package" or a user-controlled amount.
         */

        body: JSON.stringify({
          phone: phone,
          packageName: selectedPackageName
        })
      }
    );

    const data = await response.json().catch(function () {
      return null;
    });

    if (!response.ok) {
      throw new Error(
        (data && data.message) ||
        `Payment request failed (HTTP ${response.status}).`
      );
    }

    if (!data || data.success !== true) {
      throw new Error(
        (data && data.message) ||
        "The backend did not confirm that the STK Push request was accepted."
      );
    }

    currentCheckoutRequestID =
      data.checkoutRequestID || null;

    /*
     * IMPORTANT:
     * A successful STK Push request is not a completed payment.
     * Do not mark the membership ACTIVE here.
     * The backend must verify and store the Safaricom callback.
     */

    button.disabled = false;
    button.textContent = "Send Another STK Push";

    setPaymentStatus(
      "STK Push request accepted. Check " +
      phone +
      " and enter your M-Pesa PIN only if you want to pay. " +
      "This message does not confirm payment or activate membership. " +
      "Checkout reference: " +
      (currentCheckoutRequestID || "not provided") +
      ".",
      "waiting"
    );

    showToast(
      "STK Push request accepted. Check your phone."
    );

  } catch (error) {
    console.error(
      "Online Sphere STK Push error:",
      error
    );

    button.disabled = false;
    button.textContent = "📱 Send M-Pesa STK Push";

    setPaymentStatus(
      "Unable to start payment: " +
      (error.message || "Please try again."),
      "error"
    );

  } finally {
    paymentRequestInProgress = false;
  }
}

/* OPPORTUNITIES */

const opportunityData = {
  "Transcription":
    "Transcription involves converting audio or video into written text. Requirements vary by platform and client.",

  "Freelancing":
    "Freelancing allows you to offer services such as graphic design, writing, web development, editing or virtual assistance.",

  "Writing":
    "Writing and editing opportunities can include content creation, proofreading, research and other legitimate digital services."
};

function viewOpportunity(type) {
  document.getElementById("opportunityTitle").textContent =
    type;

  document.getElementById("opportunityText").textContent =
    opportunityData[type] ||
    "Explore this digital opportunity and carefully check its requirements.";

  document.getElementById("opportunityModal")
    .classList.add("show");
}

function closeOpportunity() {
  document.getElementById("opportunityModal")
    .classList.remove("show");
}

function saveOpportunity() {
  const title =
    document.getElementById("opportunityTitle").textContent;

  const user = readDemoUser();

  if (!user) {
    showToast(
      "Create a profile to save opportunities in this demo."
    );

    closeOpportunity();
    return;
  }

  try {
    const saved = JSON.parse(
      localStorage.getItem(
        "onlineSphereSavedOpportunities"
      ) || "[]"
    );

    if (!saved.includes(title)) {
      saved.push(title);
    }

    localStorage.setItem(
      "onlineSphereSavedOpportunities",
      JSON.stringify(saved)
    );

    showToast("Saved to this browser's demo profile.");

  } catch (error) {
    showToast(
      "Unable to save this opportunity in this browser."
    );
  }

  closeOpportunity();
}

/* TOAST NOTIFICATION */

function showToast(message) {
  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = window.setTimeout(function () {
    toast.classList.remove("show");
  }, 3500);
}

/* CLOSE MODALS WHEN BACKGROUND IS TAPPED */

function closeOnBackdrop(id, callback) {
  const modal = document.getElementById(id);

  modal.addEventListener("click", function (event) {
    if (event.target === modal) {
      callback();
    }
  });
}

closeOnBackdrop("authModal", closeModal);
closeOnBackdrop("paymentModal", closePaymentModal);
closeOnBackdrop("opportunityModal", closeOpportunity);

/* ESCAPE KEY */

document.addEventListener("keydown", function (event) {
  if (event.key === "Escape") {
    closeModal();
    closePaymentModal();
    closeOpportunity();

    document.getElementById("mobileMenu")
      .classList.remove("show");

    document.querySelector(".menu-button")
      .setAttribute("aria-expanded", "false");
  }
});

/* SCROLL REVEAL */

const revealElements = document.querySelectorAll(
  ".category-card,.opportunity-card,.step,.price-card,.split-section"
);

if ("IntersectionObserver" in window) {
  const observer = new IntersectionObserver(
    function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.style.opacity = "1";
          entry.target.style.transform = "translateY(0)";

          observer.unobserve(entry.target);
        }
      });
    },
    { threshold: 0.08 }
  );

  revealElements.forEach(function (element) {
    element.style.opacity = "0";
    element.style.transform = "translateY(20px)";
    element.style.transition =
      "opacity .6s ease, transform .6s ease";

    observer.observe(element);
  });
}
</script>
